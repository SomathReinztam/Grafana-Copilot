services:
  northwind-db:
    image: postgres:15
    container_name: northwind-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: northwind
    ports:
      - "5434:5432"
    volumes:
      - northwind_data:/var/lib/postgresql/data
      # Loaded automatically on first start (empty data volume)
      - ./northwind.sql:/docker-entrypoint-initdb.d/northwind.sql

volumes:
  northwind_data:

# Sample database used to demo the agent. It is intentionally kept separate from the
# main docker-compose: in real use, the user brings their own PostgreSQL database.
# Start it with:  docker compose -f example-db/docker-compose.yml up -d
